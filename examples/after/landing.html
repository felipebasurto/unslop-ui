<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ledger</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white text-slate-900">
  <header class="flex items-center justify-between p-6">
    <span class="font-bold">Ledger</span>
  </header>
  <section class="px-6 py-24 text-center">
    <h1 class="text-5xl font-bold">Manage your team's money</h1>
    <a href="/signup" class="mt-8 inline-block rounded bg-indigo-600 px-6 py-3 text-white">Get started</a>
  </section>
  <section class="grid grid-cols-3 gap-6 px-6">
    <div>
      <h3>Smart sync</h3>
      <p>Keeps your files in sync across your devices.</p>
    </div>
    <div>
      <h3>AI receipts</h3>
      <p>Capture receipts with AI.</p>
    </div>
    <div>
      <h3>Card controls</h3>
      <p>Set limits per card.</p>
    </div>
  </section>
  <form class="px-6 py-12">
    <label for="email">Email address</label>
    <input id="email" class="border" />
    <button aria-label="Subscribe to newsletter">Subscribe</button>
  </form>
</body>
</html>
