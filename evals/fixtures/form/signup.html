<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up</title></head>
<body>
  <form class="grid gap-2 p-8">
    <h1>Create your account</h1>
    <p>Fill out the form below to create your account and get started.</p>

    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="Enter your email address" />
    <small>We'll use this email address to contact you.</small>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" />
    <small>At least 12 characters.</small>
    <button type="button" aria-label="Show password">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" /></svg>
    </button>

    <button type="submit">✨ Create account</button>
  </form>
</body>
</html>
