name: False positive
description: The skill cut or rewrote something that should have stayed
labels: [false-positive]
body:
  - type: textarea
    id: snippet
    attributes:
      label: The code
      description: The smallest snippet that reproduces it. Paste the real markup, not a description.
      render: tsx
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule
      description: The id from the report, such as U9 or unslop 13.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it should stay
      description: What the element does in the product (real state, real order, legal text, an action).
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: The agent and model you gave the skill to, and the unslop-ui version.
