<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unslop-ui, one change at a time</title>
<style>
  :root {
    --bg: #f5f7fb;
    --ink: #0f172a;
    --muted: #475569;
    --line: #e4e4e1;
    --lime: #d9f26b;
    --rule: #1d4ed8;
    --done: #15803d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  #stage { position: absolute; inset: 0; }
  #top { position: absolute; left: 40px; top: 28px; font-weight: 600; font-size: 20px; }
  #top span { color: var(--muted); font-weight: 400; }

  /* The sheet, shown large. #wrap sets the size, #sheet-slot animates the entrance. */
  #wrap { position: absolute; left: 130px; top: 110px; transform-origin: 0 0; transform: scale(1.35); }
  #sheet-slot { transform-origin: 170px 185px; }
  .sheet {
    position: relative;
    width: 340px;
    padding: 20px;
    box-sizing: border-box;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 14px 34px rgba(15,23,42,.10);
    color: #111111;
  }
  .grabber { width: 36px; height: 5px; margin: 0 auto 12px; border-radius: 999px; background: var(--line); }
  .sheet-head { position: relative; margin-bottom: 12px; }
  .close {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; padding: 0; border: 0; border-radius: 999px;
    font-size: 14px; line-height: 28px; background: #f4f4f2; color: #111111; cursor: default;
  }
  .title { margin: 0; text-align: center; font-size: 17px; font-weight: 600; line-height: 22px; }
  .copy { margin: 0 0 12px; font-size: 13px; line-height: 18px; color: #6b6b6b; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 40px; margin-top: 8px; padding: 0; box-sizing: border-box;
    border: 1px solid #dcdcd8; border-radius: 999px; background: #ffffff; color: #111111;
    font-family: inherit; font-size: 14px; font-weight: 500;
  }
  .btn--primary { background: var(--lime); border-color: var(--lime); }
  .btn svg { width: 14px; height: 14px; }
  .foot { margin: 16px 0 0; font-size: 11px; line-height: 16px; color: #6b6b6b; text-align: center; }

  /* Ring and leader line: they point at the one thing that changes. */
  #ring {
    position: absolute; box-sizing: border-box; border: 4px solid var(--rule); border-radius: 12px;
    opacity: 0; pointer-events: none;
  }
  #lead { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
  #lead line { stroke: var(--rule); stroke-width: 3; }
  #lead circle { fill: var(--rule); }

  /* The explanation panel: one change, two short sentences. */
  #panel { position: absolute; left: 720px; top: 170px; width: 480px; opacity: 0; }
  #count { font-family: var(--mono); font-size: 20px; color: var(--muted); margin-bottom: 18px; }
  #tag {
    display: inline-block; padding: 8px 16px; border-radius: 999px;
    background: var(--rule); color: #ffffff; font-family: var(--mono); font-size: 22px; font-weight: 600;
  }
  #head { margin: 22px 0 12px; font-size: 44px; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  #body { margin: 0; font-size: 28px; line-height: 1.4; color: var(--muted); text-wrap: balance; }
  #status {
    display: inline-block; margin-top: 28px; padding: 8px 18px; border-radius: 999px;
    font-size: 22px; font-weight: 600; border: 3px solid var(--rule); color: var(--rule);
  }
  #status.done { border-color: var(--done); color: var(--done); background: #f0fdf4; }
  #cmd { margin-top: 30px; font-family: var(--mono); font-size: 34px; color: var(--rule); font-weight: 600; }

  /* Intro card */
  #intro {
    position: absolute; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center;
  }
  #intro img { width: 120px; height: 120px; }
  #intro h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; }
  #intro p { margin: 0; font-size: 26px; color: var(--muted); }
</style>
</head>
<body>
<div id="stage">
  <div id="top">unslop-ui <span>&middot; Share Workspace</span></div>

  <div id="wrap"><div id="sheet-slot"></div></div>
  <div id="ring"></div>
  <svg id="lead" width="1280" height="720" viewBox="0 0 1280 720" aria-hidden="true"></svg>

  <div id="panel">
    <div id="count"></div>
    <div id="tag"></div>
    <h2 id="head"></h2>
    <p id="body"></p>
    <div id="status"></div>
    <div id="cmd"></div>
  </div>

  <div id="intro">
    <img src="../logo.svg" alt="">
    <h1>unslop-ui</h1>
    <p>A share sheet, before and after unslop-ui.</p>
  </div>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  // cubic-bezier(0.23, 1, 0.32, 1), the strong ease-out, solved numerically.
  function bezier(x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    function sx(t) { return ((ax * t + bx) * t + cx) * t; }
    function sy(t) { return ((ay * t + by) * t + cy) * t; }
    function dx(t) { return (3 * ax * t + 2 * bx) * t + cx; }
    return function (x) {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x, lo = 0, hi = 1;
      for (var i = 0; i < 8; i++) {
        var e = sx(t) - x, d = dx(t);
        if (Math.abs(e) < 1e-7 || Math.abs(d) < 1e-7) break;
        t -= e / d;
      }
      t = Math.min(Math.max(t, 0), 1);
      for (var j = 0; j < 30 && Math.abs(sx(t) - x) > 1e-7; j++) {
        if (sx(t) < x) lo = t; else hi = t;
        t = (lo + hi) / 2;
      }
      return sy(t);
    };
  }
  var easeOut = bezier(0.23, 1, 0.32, 1);

  // Critically damped spring (no bounce) for the sheet's entrance.
  function spring(x, response) {
    if (x <= 0) return 0;
    var w = 2 * Math.PI / response;
    return 1 - (1 + w * x) * Math.exp(-w * x);
  }
  function E(x) { return Math.max(0, Math.min(1, x)); }
  function $(s) { return document.querySelector(s); }

  // One change per scene, in this order.
  var STEPS = [
    { tag: 'U4 · botsplaining', head: 'Cut the paragraph that explains the sheet',
      body: 'The buttons already show what it says.',
      target: 'a-invite', kind: 'cut' },
    { tag: 'U11 · decorative icon', head: 'Remove the icon',
      body: 'The label already says what the button does.',
      target: 'a-send-icon', kind: 'cut' },
    { tag: 'U5 · leaked note', head: 'Cut the footer note',
      body: 'It explains the product, not this sheet. Move it to docs.',
      target: 'a-footer', kind: 'cut' },
    { tag: 'State label', head: 'Name the button for what it does',
      body: '"Copied" is what it shows after a click. At rest it says "Copy link".',
      target: 'a-copy-label', kind: 'swap' },
    { tag: 'Repeated word', head: 'Shorten "Send Invite Link"',
      body: 'The title already says share, so "Invite" repeats it.',
      target: 'a-send-label', kind: 'swap' }
  ];

  // What the sheet looks like once k changes are done.
  function stateAfter(k) {
    return {
      invite: k < 1,
      icon: k < 2,
      footer: k < 3,
      copy: k >= 4 ? 'Copy link' : 'Copied',
      send: k >= 5 ? 'Send link' : 'Send Invite Link'
    };
  }

  // Timeline, in seconds
  var T_INTRO = 2.6;               // intro lifts away, sheet enters
  var T_START = 6.0;               // first change starts
  var D = 5.4;                     // length of one change
  var T_FINAL = T_START + STEPS.length * D;
  var ENTER = 0.5;                 // panel and ring appear
  var CUT_AT = 3.4, CUT_LEN = 0.6; // the change itself
  var EXIT_AT = 5.0;               // panel leaves, faster than it came

  function sheetHTML(s, swapOpacity) {
    var copyStyle = swapOpacity.copy !== undefined ? ' style="opacity:' + swapOpacity.copy + '"' : '';
    var sendStyle = swapOpacity.send !== undefined ? ' style="opacity:' + swapOpacity.send + '"' : '';
    var h = '<section class="sheet" id="sheet">' +
      '<div class="grabber"></div>' +
      '<header class="sheet-head"><button class="close" type="button" aria-label="Close">&#10005;</button>' +
      '<h2 class="title">Share Workspace</h2></header>';
    if (s.invite) h += '<p class="copy" id="a-invite">Invite people to Open shared workspace links. They join by opening the link you send them.</p>';
    h += '<p class="copy">Anyone with this link can join. It expires next week.</p>';
    h += '<button class="btn btn--primary" type="button">' +
      (s.icon ? '<svg id="a-send-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2.5 10v3.5h11V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '') +
      '<span id="a-send-label"' + sendStyle + '>' + s.send + '</span></button>';
    h += '<button class="btn" type="button"><span id="a-copy-label"' + copyStyle + '>' + s.copy + '</span></button>';
    h += '<button class="btn" type="button">Create Another Link</button>';
    if (s.footer) h += '<p class="foot" id="a-footer">To remove people or turn off a link, use Intent on your Mac.</p>';
    return h + '</section>';
  }

  // The element that leaves stops taking up space as it fades, so what is below glides up.
  // Decoration (the icon) only fades in place.
  function collapse(id, p) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.opacity = String(p);
    if (id === 'a-send-icon') return;
    var cs = getComputedStyle(el);
    var h = el.offsetHeight, mt = parseFloat(cs.marginTop), mb = parseFloat(cs.marginBottom);
    el.style.overflow = 'hidden';
    el.style.maxHeight = (h * p) + 'px';
    el.style.marginTop = (mt * p) + 'px';
    el.style.marginBottom = (mb * p) + 'px';
  }

  // Dim everything on the sheet except the part that holds the target.
  function spotlight(targetId, amount) {
    var sheet = $('#sheet');
    var target = document.getElementById(targetId);
    if (!sheet || !target) return;
    var keep = target;
    while (keep && keep.parentElement !== sheet) keep = keep.parentElement;
    Array.prototype.forEach.call(sheet.children, function (c) {
      if (c !== keep) c.style.opacity = String(1 - 0.55 * amount);
    });
  }

  function placeRing(targetId, opacity, panelOpacity) {
    var ring = $('#ring');
    var lead = $('#lead');
    Array.prototype.slice.call(lead.children).forEach(function (n) { n.parentNode.removeChild(n); });
    var el = document.getElementById(targetId);
    if (!el || opacity <= 0.001) { ring.style.opacity = '0'; return; }
    var r = el.getBoundingClientRect();
    var pad = 7;
    ring.style.left = (r.left - pad) + 'px';
    ring.style.top = (r.top - pad + 1) + 'px';
    ring.style.width = (r.width + pad * 2) + 'px';
    ring.style.height = (r.height + pad * 2 - 2) + 'px';
    ring.style.borderRadius = targetId === 'a-send-icon' ? '999px' : '12px';
    ring.style.opacity = String(opacity);

    // One line from the ring to the tag.
    var tag = $('#tag').getBoundingClientRect();
    var x1 = r.right + pad, y1 = (r.top + r.bottom) / 2;
    var x2 = tag.left - 12, y2 = (tag.top + tag.bottom) / 2;
    var lineOp = String(Math.min(opacity, panelOpacity));
    function seg(ax, ay, bx, by) {
      var s = document.createElementNS(NS, 'line');
      s.setAttribute('x1', ax); s.setAttribute('y1', ay); s.setAttribute('x2', bx); s.setAttribute('y2', by);
      s.setAttribute('opacity', lineOp);
      s.setAttribute('stroke-linecap', 'round');
      lead.appendChild(s);
    }
    if (targetId === 'a-send-icon') {
      // The icon sits inside a label. Leave through the gap above the button instead of across the text.
      var btn = el.closest('.btn').getBoundingClientRect();
      var cx = (r.left + r.right) / 2, gapY = btn.top - 8;
      seg(cx, r.top - pad, cx, gapY);
      seg(cx, gapY, x2, y2);
      x1 = cx; y1 = r.top - pad;
    } else {
      seg(x1, y1, x2, y2);
    }
    var dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', x1); dot.setAttribute('cy', y1); dot.setAttribute('r', 5);
    dot.setAttribute('opacity', String(Math.min(opacity, panelOpacity)));
    lead.appendChild(dot);
  }

  function setPanel(opts) {
    $('#count').textContent = opts.count || '';
    $('#count').style.display = opts.count ? 'block' : 'none';
    $('#tag').textContent = opts.tag || '';
    $('#tag').style.display = opts.tag ? 'inline-block' : 'none';
    $('#head').textContent = opts.head;
    $('#body').textContent = opts.body || '';
    $('#body').style.display = opts.body ? 'block' : 'none';
    var st = $('#status');
    st.style.display = opts.status ? 'inline-block' : 'none';
    st.textContent = opts.status || '';
    st.className = opts.done ? 'done' : '';
    var cmd = $('#cmd');
    cmd.textContent = opts.cmd || '';
    cmd.style.display = opts.cmd ? 'block' : 'none';
    var p = opts.opacity;
    $('#panel').style.opacity = String(p);
    $('#panel').style.transform = 'translateY(' + (opts.rise) + 'px)';
  }

  window.setT = function (ms) {
    var t = ms / 1000;

    // Intro lifts away with a short blur.
    var introOut = easeOut(E((t - 2.2) / 0.4));
    $('#intro').style.opacity = String(1 - introOut);
    $('#intro').style.filter = 'blur(' + (6 * introOut).toFixed(2) + 'px)';

    // Sheet enters with a critically damped spring and a 0.96 to 1 scale.
    var inP = spring(t - T_INTRO, 0.4);
    var slot = $('#sheet-slot');
    slot.style.opacity = String(E(inP));
    slot.style.transform = 'scale(' + (0.96 + 0.04 * inP) + ')';
    $('#ring').style.opacity = '0';

    if (t < T_INTRO) { slot.innerHTML = ''; setPanel({ head: '', opacity: 0, rise: 0 }); placeRing('', 0, 0); return; }

    // Opening scene: the screen as it is.
    if (t < T_START) {
      slot.innerHTML = sheetHTML(stateAfter(0), {});
      placeRing('', 0, 0);
      var pIn = easeOut(E((t - 2.9) / 0.5));
      var pOut = easeOut(E((t - 5.6) / 0.4));
      setPanel({ head: 'An agent wrote this screen.', body: 'We change it one thing at a time.',
                 opacity: pIn * (1 - pOut), rise: 12 * (1 - pIn) - 8 * pOut });
      return;
    }

    // One change per scene.
    if (t < T_FINAL) {
      var k = 1 + Math.floor((t - T_START) / D);      // 1..5
      var u = t - (T_START + (k - 1) * D);
      var step = STEPS[k - 1];
      var enter = easeOut(E(u / ENTER));
      var exit = easeOut(E((u - EXIT_AT) / 0.4));
      var changed = u >= CUT_AT;
      var cutP = E((u - CUT_AT) / CUT_LEN);

      var state = u >= CUT_AT + CUT_LEN ? stateAfter(k) : stateAfter(k - 1);
      var swap = {};

      if (step.kind === 'swap' && u >= CUT_AT && u < CUT_AT + CUT_LEN) {
        // Label swap: the old text fades out, the new text fades in. Never both at once.
        var key = step.target === 'a-copy-label' ? 'copy' : 'send';
        var outP = easeOut(E((u - CUT_AT) / 0.2));
        var inP2 = easeOut(E((u - CUT_AT - 0.2) / 0.4));
        state = u < CUT_AT + 0.2 ? stateAfter(k - 1) : stateAfter(k);
        swap[key] = u < CUT_AT + 0.2 ? (1 - outP) : inP2;
      }

      slot.innerHTML = sheetHTML(state, swap);

      if (step.kind === 'cut' && u >= CUT_AT && u < CUT_AT + CUT_LEN) {
        var p = 1 - easeOut(cutP);
        collapse(step.target, p);
      }

      var dim = enter * (1 - easeOut(E((u - (CUT_AT + CUT_LEN + 0.2)) / 0.4)));
      if (u < CUT_AT + CUT_LEN + 0.6) spotlight(step.target, dim);

      var panelOp = enter * (1 - exit);
      setPanel({
        count: k + ' of ' + STEPS.length,
        tag: step.tag, head: step.head, body: step.body,
        status: changed ? (step.kind === 'cut' ? '✓ Cut' : '✓ Changed') : (step.kind === 'cut' ? 'To cut' : 'To change'),
        done: changed,
        opacity: panelOp, rise: 12 * (1 - enter) - 8 * exit
      });

      // The ring is gone once the change starts; it does not need to follow a collapsing element.
      var ringOp = enter * (1 - easeOut(E((u - CUT_AT) / 0.2)));
      placeRing(step.target, ringOp, panelOp);
      return;
    }

    // Closing scene.
    slot.innerHTML = sheetHTML(stateAfter(STEPS.length), {});
    placeRing('', 0, 0);
    var fIn = easeOut(E((t - T_FINAL) / 0.5));
    setPanel({ head: 'Five changes, one at a time.',
               body: 'The expiry line and the close button stay. People act on one, and the other names the control.',
               cmd: '/unslop-ui', opacity: fIn, rise: 12 * (1 - fIn) });
  };
})();
</script>
</body>
</html>
