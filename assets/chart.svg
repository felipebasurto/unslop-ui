<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">A line chart before and after /unslop-ui</title>
  <desc id="d">Before: the title names the chart type and has an emoji, a subtitle explains how to read it, a legend repeats the title for a single series, and every point carries its value. After: the title names the metric and only the latest value is labeled.</desc>
  <style>
    .page { fill: #ffffff; stroke: #d4d4d8; }
    .card { fill: #fafafa; stroke: #e4e4e7; }
    .ink { fill: #18181b; }
    .ink2 { fill: #52525b; }
    .muted { fill: #a1a1aa; }
    .head { fill: #71717a; }
    .rule { stroke: #e4e4e7; }
    .grid { stroke: #ececec; }
    .tell { fill: #d03b3b; }
    .tag { fill: #fdecec; stroke: #f3b4b4; }
    .tagtext { fill: #b42323; }
    .good { fill: #15803d; }
    .live { fill: #22c55e; }
    .series { stroke: #2a78d6; fill: none; }
    .dot { fill: #2a78d6; stroke: #ffffff; }
    .legend { fill: #2a78d6; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #18181b; stroke: #3f3f46; }
      .card { fill: #1f1f22; stroke: #34343a; }
      .ink { fill: #f4f4f5; }
      .ink2 { fill: #a1a1aa; }
      .muted { fill: #71717a; }
      .head { fill: #a1a1aa; }
      .rule { stroke: #27272a; }
      .grid { stroke: #2a2a2e; }
      .tell { fill: #f87171; }
      .tag { fill: #3b1515; stroke: #7f2a2a; }
      .tagtext { fill: #fca5a5; }
      .good { fill: #4ade80; }
      .series { stroke: #3987e5; }
      .dot { fill: #3987e5; stroke: #18181b; }
      .legend { fill: #3987e5; }
    }
  </style>
  <text class="head" x="24" y="26" font-size="15" font-weight="600">Before</text>
  <text class="head" x="656" y="26" font-size="15" font-weight="600">After /unslop-ui</text>
  <rect class="page" x="24" y="40" width="600" height="396" rx="12"/>
  <rect class="page" x="656" y="40" width="600" height="396" rx="12"/>
  <text class="tell" x="52" y="80" font-size="17" font-weight="700">📈 Line chart of weekly active users</text>
  <rect class="tag" x="572" y="65" width="36" height="20" rx="10"/><text class="tagtext" x="590.0" y="79" font-size="11" font-weight="700" text-anchor="middle">U12</text>
  <text class="tell" x="52" y="106" font-size="13">Each point represents one week — hover over a point</text>
  <text class="tell" x="52" y="124" font-size="13">to see the exact value.</text>
  <rect class="tag" x="572" y="100" width="36" height="20" rx="10"/><text class="tagtext" x="590.0" y="114" font-size="11" font-weight="700" text-anchor="middle">U13</text>
  <rect class="legend" x="52" y="140" width="12" height="12" rx="2"/>
  <text class="tell" x="72" y="151" font-size="12">Weekly active users</text>
  <rect class="tag" x="572" y="136" width="36" height="20" rx="10"/><text class="tagtext" x="590.0" y="150" font-size="11" font-weight="700" text-anchor="middle">U14</text>
  <line class="grid" x1="92" y1="342.0" x2="592" y2="342.0"/>
  <text class="muted" x="84" y="346.0" font-size="11" text-anchor="end">800</text>
