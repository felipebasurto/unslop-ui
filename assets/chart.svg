<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="t d">
  <title id="t">A two-series line chart before and after /unslop-ui</title>
  <desc id="d">Before: the title names the chart type and has an emoji, a subtitle explains how to read it, every point carries its value, a frame box and dense dark gridlines surround the plot, and a legend sits below it. After: the title names the metric, gridlines are three hairlines, and each line is labeled at its end with its name and latest value.</desc>
